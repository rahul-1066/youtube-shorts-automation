name: Auto Shorts Generator
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3,7,12,13,14,15,16 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Optimized: v3 -> v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Optimized: v4 -> v5
        with:
          python-version: '3.10'
          cache: 'pip' # <--- SPEED BOOST: Caches installed packages

      - name: Install System Dependencies
        # Optimized: Removed 'apt-get update' (saves ~45s)
        # ImageMagick is pre-installed on ubuntu-latest, we just ensure it and fix the policy
        run: |
          sudo apt-get install -y imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        # This will be instant if cache hits
        run: pip install -r requirements.txt

      - name: Run Generator & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Commit & Push History
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add history.json
          git commit -m "Update question history [skip ci]" || echo "No changes to commit"
          git push
