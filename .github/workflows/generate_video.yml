name: Auto Shorts Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3,7,12,13,14,15,16 * * *'
    #- cron: '24 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    # PERMISSIONS REQUIRED TO COMMIT CHANGES
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
          pip install -r requirements.txt

      - name: Run Generator & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      # --- NEW STEP: SAVE HISTORY ---
      - name: Commit & Push History
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add history.json
          git commit -m "Update question history [skip ci]" || echo "No changes to commit"
          git push
